devices:
  # Image builder: GCP VM (c4a-standard-4, arm64, no GPU), a "virtual builder" that runs
  # no app. Off between builds: `fleetctl edge build sandbox-01` starts it, and it powers
  # itself off 20 minutes after the last build. Reachable only over Tailscale.
  sandbox-01:
    site: sandbox
    environment: staging
    tailscale:
      hostname: 100.79.30.88
      ssh_user: ai
    hardware:
      family: jetson-orin
      memory_gb: 16
    runtime_profile: docker-jetson-v1
    cloud_vm:
      project: gen-lang-client-0603015471
      zone: asia-south1-a
      instance: sandbox-builder-01
  mantri-edge-01:
    site: mantri
    environment: production
    tailscale:
      hostname: 100.94.147.105
      ssh_user: ai
    hardware:
      family: jetson-orin
      memory_gb: 8
    runtime_profile: docker-jetson-v1
  # Nipha: tapping + deslagging, cameras D03/D05 (Tailscale nipha2, LAN 192.168.0.166).
  nipha-edge-01:
    site: nipha
    environment: production
    tailscale:
      hostname: 100.76.230.66
      ssh_user: ai
    hardware:
      family: jetson-orin
      memory_gb: 8
    runtime_profile: docker-jetson-v1
  # Test Device (not production). Replaces the sandbox-01 placeholder for tracer runs.
  pashupati-edge-01:
    site: pashupati
    environment: staging
    tailscale:
      hostname: 100.121.10.15
      ssh_user: ai
    hardware:
      family: jetson-orin
      memory_gb: 8
    runtime_profile: docker-jetson-v1
