# HiCon: the whole Jetson in one vision container plus MediaMTX.
# The image comes only from the Release manifest (METALCLOUD_IMAGE, pinned by
# digest); code, Engines and config are never mounted from anywhere else.
# Replaces the native hicon-vision.service and hicon-mediamtx.service. The NVR
# timeline units (hicon-timeline*, :8555) stay native and untouched.
services:
  hicon-vision:
    image: ${METALCLOUD_IMAGE}
    restart: unless-stopped
    # Streams 1 and 2 push their overlay to rtsp://127.0.0.1:8554/streamN_overlay.
    depends_on:
      mediamtx:
        condition: service_healthy
    runtime: nvidia
    network_mode: host
    ipc: host
    # Native: MemoryHigh=3G, ~1.8 GB used (2026-10-23); headroom for Engine load.
    mem_limit: 5g
    memswap_limit: 6g
    shm_size: 512m
    stop_grace_period: 15s

    # The image is immutable at run time: a write outside Persistent data fails
    # loudly instead of vanishing on the next Release.
    read_only: true
    tmpfs:
      - /tmp
      - /run

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - CUDA_MODULE_LOADING=LAZY
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - MALLOC_ARENA_MAX=2
      - GST_DEBUG=1
      # NOTE: DISPLAY intentionally unset — headless.

    # Operational flags come with the Release; secrets stay on the Device and
    # never enter the registry. A missing secrets file stops the stage.
    env_file:
      - ${METALCLOUD_RELEASE}/config/site.env
      - ${METALCLOUD_PERSISTENT}/secrets/hicon.env

    volumes:
      # Engines (checked against SHA256SUMS by the entrypoint) and site config.
      - ${METALCLOUD_RELEASE}:/release:ro
      # Everything the app writes (config.py: HICON_BASE_DIR=/app/ai_vision).
      - ${METALCLOUD_PERSISTENT}/database:/app/ai_vision/data
      - ${METALCLOUD_PERSISTENT}/logs:/app/ai_vision/logs
      - ${METALCLOUD_PERSISTENT}/output:/app/ai_vision/output
      - ${METALCLOUD_PERSISTENT}/cache/gst-registry:/app/cache/gst-registry

    devices:
      - /dev/nvmap:/dev/nvmap

    ulimits:
      memlock:
        soft: -1
        hard: -1

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

    healthcheck:
      test: ["CMD", "/app/docker/healthcheck.sh"]
      interval: 60s
      timeout: 15s
      start_period: 180s
      retries: 3

  mediamtx:
    # bluenviron/mediamtx 1.20.1-ffmpeg, copied unchanged into our registry; Mantri
    # and Steelcast run the same digest. HiCon ran 1.16.3 natively. -ffmpeg because
    # the plain image has no shell, so nothing to run a healthcheck with.
    image: asia-south1-docker.pkg.dev/gen-lang-client-0603015471/edge/mediamtx:1.20.1-ffmpeg@sha256:16c56911dbd1fd7a85455042fa8320779fc8bf6575c6903f74023b202c1a620c
    restart: unless-stopped
    network_mode: host
    # ai_vision/configs/mediamtx.stream0.yml as env overrides of the image's default
    # config (whose `all_others` path accepts the streamN_overlay publishers). No
    # camera credentials: DeepStream reads the cameras itself and only publishes here.
    environment:
      - MTX_LOGLEVEL=info
      - MTX_RTSPTRANSPORTS=tcp
      - MTX_RTSPADDRESS=127.0.0.1:8554
      - MTX_RTMP=no
      - MTX_HLS=no
      - MTX_SRT=no
      - MTX_WEBRTC=no
      - MTX_READTIMEOUT=60s
      - MTX_WRITETIMEOUT=30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8554"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
